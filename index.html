<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anand Rajput - Professional Profile</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            /* Moody, artistic dark gradient background */
            background: linear-gradient(135deg, #1a1c29, #2a2d43, #1a1c29);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            /* Strong, dramatic shadows for a sharp look */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            width: 85%;
            max-width: 400px;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            /* Off-white/cream border */
            border: 4px solid #f8f5ee; 
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
            color: #ffffff;
        }
        .description {
            font-size: 15px;
            color: #b0b3c5;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .cta-button {
            /* Colorful yet professional gradient button */
            background: linear-gradient(45deg, #ff6b6b, #c44dff);
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(196, 77, 255, 0.3);
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Apni Photo ka link yahan daalein -->
        <img src="https://via.placeholder.com/150" alt="Anand Rajput" class="profile-pic">

        <div class="name">Anand Rajput</div>
        <div class="description">Number save karne ke liye niche click karein, aur fir mujhe WhatsApp par message karein.</div>

        <button class="cta-button" onclick="rotateAndDial()">Click here to connect on WhatsApp</button>
    </div>

    <script>
        // ==========================================
        // Yahan Apne Real WhatsApp Numbers Daalein
        // ==========================================
        const numbers = [
            "+919876543210", 
            "+919876543211", 
            "+919876543212"
        ];
        // ==========================================
        
        function rotateAndDial() {
            const randomIndex = Math.floor(Math.random() * numbers.length);
            const selectedNumber = numbers[randomIndex];
            
            window.location.href = "tel:" + selectedNumber;
        }
    </script>
</body>
</html>
