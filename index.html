<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            text-align: center;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .name {
            font-size: 26px;
            font-weight: bold;
            color: #333;
        }
        .description {
            color: #666;
            margin: 15px 25px 35px;
            font-size: 16px;
            line-height: 1.5;
        }
        .cta-button {
            background-color: #000000;
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        .cta-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <img src="https://via.placeholder.com/150" alt="Profile Picture" class="profile-pic">

    <div class="name">Aapka Naam</div>
    <div class="description">Number save karne ke liye niche click karein, aur fir humein WhatsApp par message bhejein.</div>

    <button class="cta-button" onclick="rotateAndDial()">Click here to message on WhatsApp</button>

    <script>
        const numbers = [
            "+919876543210", 
            "+919876543211", 
            "+919876543212"
        ];
        
        function rotateAndDial() {
            const randomIndex = Math.floor(Math.random() * numbers.length);
            const selectedNumber = numbers[randomIndex];
            window.location.href = "tel:" + selectedNumber;
        }
    </script>
</body>
</html>
